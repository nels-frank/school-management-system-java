<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
         <link rel="stylesheet" href="css/materialize.min.css"/>
        <script type="text/javascript" src="js/jquery-2.1.1.min.js"></script>
        <script type="text/javascript" src="js/materialize.min.js"></script>
        <script src="js/materialize.min.js"></script>
        <link rel="stylesheet" href="css/fonts.googleapis.com/css?family=Montserrat"/>
        <style>
            
            tr.oddrows {
                background-color: #333333;
                color: yellowgreen;
            }


            tr.evenrows {
                background-color: #0d253d;
                color: white;
            }
            table{
                width: 80%
            }
            table.people th{
                background-color: #0d253d;
                color: white;
            }
            a{
                color:white;
            }
        
        </style>
    </h:head>
    <h:body style="background: #333333; color:yellow">
      <center>   
          <h:form> 
       class 10=Pre-Nursery, 101=Nursery One, 102=Nursery Two, 103=Nursery Three, 100=Primary One, 200=Primary Two, 300=Primary Three, 400=Primary Four, 500=Primary Five, 600=Primary Six,
          <h:dataTable binding="#{table}" value="#{subjectsController.allSubjects}" var="stud" rowClasses="oddrows,evenrows" rules="all" width="60%" border="1" styleClass="people">
                            <h:column>
                                <f:facet name="header">
                                    S/N
                                </f:facet>
                                <center>   <h:outputText value="#{table.rowIndex+1}" /></center>
                            </h:column>
                            <h:column>
                                <f:facet name="header">
                                    Subject Name
                                </f:facet>
                                <h:outputText value="#{stud.subjectname}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">
                                    Class
                                </f:facet>
                                <h:outputText value="#{stud.level}" />
                            </h:column>
                            <h:column>
                                <f:facet name="header">
                                   Department
                                </f:facet>
                                <h:outputText value="#{stud.category}" />
                            </h:column>
                               
            <h:column >
                <f:facet name="header">
                  Action
                </f:facet>
                <h:commandLink  action="#{subjectsController.editSubject(stud)}" value="Edit"  style=" color: green"/>
            </h:column>                    
                               
            <h:column >
                <f:facet name="header">
                  Action
                </f:facet>
                <h:commandLink  action="#{subjectsController.DeleteSubject(stud.subjectcode)}" value="Delete"  style=" color: green"/>
            </h:column> 
                            
                           

                        </h:dataTable>
          </h:form>
                    </center>
    </h:body>
</html>
