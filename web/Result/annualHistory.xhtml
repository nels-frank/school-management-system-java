<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>ANNUAL HISTORY</title>
        <link rel="shortcut icon" href="images/Jac Logo.JPG" type="image/x-icon"/>
        <link href="../css/bootstrap.css" rel="stylesheet" type="text/css"/>

        <style type="text/css">
            h3{
                color:#3a414a; 

            }
            tr.oddrows {

                color: black;
                font-size:12px;
            }


            tr.evenrows {
                color: black;
                font-size:12px;
            }
            table{
                width: 100%
            }
            table.people th{
                background-color: white;
                color: black;
                height: 10px;
                font-size: 14px
            }

        </style>
        <script language="javascript" type="text/javascript">
            function printDiv(divID) {
                //Get the HTML of div
                var divElements = document.getElementById(divID).innerHTML;
                //Get the HTML of whole page
                var oldPage = document.body.innerHTML;

                //Reset the page's HTML with div's HTML only
                document.body.innerHTML =
                        "<html><head><title></title></head><body>" +
                        divElements + "</body></html>";

                //Print Page
                window.print();

                //Restore orignal HTML
                document.body.innerHTML = oldPage;
           }
  </script>
   </h:head>
    <h:body>
         <h:form>
            <div class="row">
                <div class="col-2" style=" margin-top: 3%; margin-left: 2%">
                    <h:selectOneMenu value="#{computeresultController.examsession}" onchange="submit()" class="form-control">

                        <f:selectItem itemValue="2022/2023" itemLabel="2022/2023"/>
                        <f:selectItem itemValue="2023/2024" itemLabel="2023/2024"/>                       
                        <f:selectItem itemValue="2024/2025" itemLabel="2024/2025"/>
                        <f:selectItem itemValue="2025/2026" itemLabel="2025/2026"/>
                        <f:selectItem itemValue="2026/2027" itemLabel="2026/2027"/>
                        <f:selectItem itemValue="2027/2028" itemLabel="2027/2028"/>
                        <f:selectItem itemValue="2028/2029" itemLabel="2028/2029"/>                      
                        <f:selectItem itemValue="2029/2030" itemLabel="2029/2030"/>
                        <f:selectItem itemValue="2030/2031" itemLabel="2030/2031"/>
                        <f:selectItem itemValue="2031/2032" itemLabel="2031/2032"/>
                        <f:selectItem itemValue="2032/2033" itemLabel="2032/2033"/>
                        <f:selectItem itemValue="2033/2034" itemLabel="2033/2034"/>                       
                        <f:selectItem itemValue="2034/2035" itemLabel="2034/2035"/>
                        <f:selectItem itemValue="2035/2036" itemLabel="2035/2036"/>
                        <f:selectItem itemValue="2036/2037" itemLabel="2036/2037"/>
                        <f:selectItem itemValue="2037/2038" itemLabel="2037/2038"/>
                        <f:selectItem itemValue="2038/2039" itemLabel="2038/2039"/>
                        <f:selectItem itemValue="2039/2040" itemLabel="2039/2040"/>
                    </h:selectOneMenu>                    
                   <h:selectOneMenu value="#{computeresultController.level}" onchange="submit()" class="form-control">
                        <f:selectItem itemValue="" itemLabel="Select Level"/>
                        <f:selectItem itemValue="10" itemLabel="Pre-Nursery"/>
                        <f:selectItem itemValue="101" itemLabel="Nursery One"/>
                        <f:selectItem itemValue="102" itemLabel="Nursery Two"/>
                        <f:selectItem itemValue="103" itemLabel="Nursery Three"/>
                        <f:selectItem itemValue="100" itemLabel="Primary One"/>
                        <f:selectItem itemValue="200" itemLabel="Primary Two"/>
                        <f:selectItem itemValue="300" itemLabel="Primary Three"/>
                        <f:selectItem itemValue="400" itemLabel="Primary Four"/>
                        <f:selectItem itemValue="500" itemLabel="Primary Five"/>
                        <f:selectItem itemValue="600" itemLabel="Primary Six"/>
                        <f:selectItem itemValue="1" itemLabel="Basic 7"/>
                        <f:selectItem itemValue="2" itemLabel="Basic 8"/>
                        <f:selectItem itemValue="3" itemLabel="Basic 9"/>
                        <f:selectItem itemValue="4" itemLabel="SSS 1"/>
                        <f:selectItem itemValue="5" itemLabel="SSS 2"/>
                        <f:selectItem itemValue="6" itemLabel="SSS 3"/>

                    <h:selectOneMenu value="#{computeresultController.classcode}" onchange="submit()" class="form-control">

                    </h:selectOneMenu>           
        </div>
            </div>
        <br></br>
        
            <div class="row">
                <div class="col-1" style=" margin-left: 4%">
                    <h:commandButton value="Print" onclick="javascript:printDiv('printdiv')" style=" cursor: pointer;" class="btn-success"/>
                </div>
                <div class="col-1"></div>
            </div>
            <div class="row " >

                <div class="col-11" style=" border: 1px #000 solid; margin-left:2%" id="printdiv" >
                    <table>
                        <tr>
                              
                            <td> <b style=" font-size: 20px"> KENWILL REMEDIAL SCHOOL [KENRES]</b><br/>
                                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>ANNUAL CLASS SCORE LIST</b>
                                <hr/><br/>

                            </td>  
                            <td> </td>
                            <td>

                            </td>
                        </tr>
                        <tr>
                            <td colspan="3">
                                Class:<b> <h:outputText value=" #{computeresultController.classcode}"/></b>
                            </td>
                        </tr>
                        <tr>
                            <td>Session:<b><h:outputText value="#{computeresultController.examsession}"/></b></td>
                        </tr>                       
                    </table>
                    <h:dataTable binding="#{tatble}" value="#{computeresultController.allAnnualBank}" var="stud" rowClasses="oddrows,evenrows" rules="all" width="100%" styleClass="people" border="1" >
                        <h:column>
                            <f:facet name="header">
                                S/N
                            </f:facet>
                            <center>     <h:outputText value="#{tatble.rowIndex+1}"/> </center>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                NAME OF PUPILS
                            </f:facet>
                            <h:outputText value="#{stud.name}"/> 
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                TOTAL
                            </f:facet>
                            <center>        #{stud.finaltotal}</center>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                AVERAGE
                            </f:facet>
                            <center>    #{stud.finalaverage}</center>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                POSITION
                            </f:facet>
                            <center>   #{stud.classposition}</center>
                        </h:column>  
                        <h:column>
                            <f:facet name="header">
                                REMARK
                            </f:facet>
                            <center>   #{stud.remark}</center>
                        </h:column>                          
                         <h:column>
                          <f:facet name="header">
                                   ACTION
                                </f:facet>
                             <h:commandLink action="#{computeresultController.deleteAnnualbank(stud.code)}"  value="Delete"  style=" color: red"/>
                            </h:column>
                    </h:dataTable>
                </div>

            </div> 
        </h:form>

        <script>
            $(document).on("ready", function () {
                $('select').material_select();
            });
        </script>
    </h:body>
</html>
