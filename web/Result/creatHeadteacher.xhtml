<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>ADD HEAD TEACHER</title>
       <link rel="shortcut icon" href="images/Jac Logo.JPG" type="image/x-icon"/>
        <link href="../css/bootstrap.css" rel="stylesheet" type="text/css"/>

        <style type="text/css">
            h3{
                color:#3a414a; 

            }
            tr.oddrows {

                color: black;
                font-size:12px;
            }


            tr.evenrows {
                color: black;
                font-size:12px;
            }
            table{
                width: 100%
            }
            table.people th{
                background-color: white;
                color: black;
                height: 10px;
                font-size: 14px
            }
        </style>
    </h:head>
    <h:body style=" background-color:#333333;color: yellowgreen">
        <h:form>
            <div class="row ">  
                <div class="col-9" style=" background: #F1C050" >
                    <h:dataTable binding="#{table}" value="#{staffController.allHeadteachers}" var="stud" rowClasses="oddrows,evenrows" rules="all" width="100%" styleClass="people">
                            <h:column>
                                <f:facet name="header">
                                    S/N
                                </f:facet>
                             <center style="color:darkblue"> #{table.rowIndex+1}</center>
                            </h:column>
                            <h:column>
                                <f:facet name="header">
                                    NAME
                                </f:facet>
                                <b style="color:darkblue"> #{stud.headname}</b>
                            </h:column>
                            <h:column>
                                <f:facet name="header">
                                    SESSION
                                </f:facet>
                                <b style="color:darkblue"> #{stud.session}</b>
                            </h:column>
                            <h:column>
                                <f:facet name="header">
                                    TERM
                                </f:facet>
                                <b style="color:darkblue"> #{stud.term}</b>
                            </h:column>
                             <h:column>
                                <f:facet name="header">
                                    Action
                                </f:facet>
                                 <h:commandLink action="#{staffController.editHM(stud)}"  value="EDIT" style=" color: green"/>
                            </h:column>                           
                        </h:dataTable>
                    </div> 
                
                    <div class="col-4"  style=" border:1px #004d40 solid; margin-left: 20%; margin-top: 5%">
                        <h:selectOneMenu value="#{staffController.session}" class="form-control">
                            <f:selectItem itemValue="" itemLabel="Select Session"/>
                            <f:selectItem itemValue="2019/2020" itemLabel="2019/2020"/>
                        <f:selectItem itemValue="2020/2021" itemLabel="2020/2021"/>
                        <f:selectItem itemValue="2021/2022" itemLabel="2021/2022"/>
                        <f:selectItem itemValue="2022/2023" itemLabel="2022/2023"/>
                        <f:selectItem itemValue="2023/2024" itemLabel="2023/2024"/>                       
                        <f:selectItem itemValue="2024/2025" itemLabel="2024/2025"/>
                        <f:selectItem itemValue="2025/2026" itemLabel="2025/2026"/>
                        <f:selectItem itemValue="2026/2027" itemLabel="2026/2027"/>
                        <f:selectItem itemValue="2027/2028" itemLabel="2027/2028"/>
                        <f:selectItem itemValue="2028/2029" itemLabel="2028/2029"/>                      
                        <f:selectItem itemValue="2029/2030" itemLabel="2029/2030"/>
                        <f:selectItem itemValue="2030/2031" itemLabel="2030/2031"/>
                        <f:selectItem itemValue="2031/2032" itemLabel="2031/2032"/>
                        <f:selectItem itemValue="2032/2033" itemLabel="2032/2033"/>
                        <f:selectItem itemValue="2033/2034" itemLabel="2033/2034"/>                       
                        <f:selectItem itemValue="2034/2035" itemLabel="2034/2035"/>
                        <f:selectItem itemValue="2035/2036" itemLabel="2035/2036"/>
                        <f:selectItem itemValue="2036/2037" itemLabel="2036/2037"/>
                        <f:selectItem itemValue="2037/2038" itemLabel="2037/2038"/>
                        <f:selectItem itemValue="2038/2039" itemLabel="2038/2039"/>
                        <f:selectItem itemValue="2039/2040" itemLabel="2039/2040"/>
                        </h:selectOneMenu>
                        <h:selectOneMenu value="#{staffController.term}" class="form-control">
                            <f:selectItem itemValue="" itemLabel="Select Term"/>
                            <f:selectItem itemValue="1ST TERM" itemLabel="1ST TERM"/>
                            <f:selectItem itemValue="2ND TERM" itemLabel="2ND TERM"/>
                            <f:selectItem itemValue="3RD TERM" itemLabel="3RD TERM"/>
                        </h:selectOneMenu>
                    
                        <h:inputText  value="#{staffController.headname}" class="form-control" >
                        <f:passThroughAttribute name="placeholder" value="Head Teacher's Name"/>
                    </h:inputText>                
                        <h:commandButton action="#{staffController.updateHM()}" class="waves-effect waves-light btn"  value="REPLACE" style=" cursor: pointer">
                    </h:commandButton> 
                        <h6><h:outputText value="#{staffController.msg}" style="color: orangered"/></h6>
                 </div>
                </div>
              </h:form>

        <script>
            $(document).on("ready", function () {
                $('select').material_select();
            });
        </script>
    </h:body>
</html>
