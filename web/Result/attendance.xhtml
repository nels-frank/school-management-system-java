<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>COMPUTE ATTENDANCE</title>
        <link rel="shortcut icon" href="images/Jac Logo.JPG" type="image/x-icon"/>
        <link href="../css/bootstrap.css" rel="stylesheet" type="text/css"/>
        <style type="text/css">

           tr.oddrows {
                background-color: #333333;
                color: yellowgreen;
            }


            tr.evenrows {
                background-color: #0d253d;
                color: white;
            }
            table{
                width: 100%
            }
            table.people th{
                background-color: #0d253d;
                color: white;
                height: 10px;
            }
            a{
                color:white;
            }
        </style>
    </h:head>
    <h:body style="background: #333333;color: yellowgreen">        
        <h:form>
            <div class="row ">               
                   <div class="col s12 m2" style=" margin-top: 3%; border:1px #004d40 solid">
                    Maximum Attendance:
                    <h:inputText  value="#{computeresultController.max}" class="form-control" >
                        <f:passThroughAttribute name="placeholder" value="Maximum Attendance"/>
                    </h:inputText>                    
                    Days Present
                    <h:inputText  value="#{computeresultController.presence}" class="form-control" >
                        <f:passThroughAttribute name="placeholder" value="Days Present"/>
                    </h:inputText>
                    <h:commandButton action="#{computeresultController.saveAttendance()}" class="waves-effect waves-light btn"  value="Save" style=" cursor: pointer">
                    </h:commandButton>
                    
                </div>           
                <div class="col s12 m2" style=" margin-top: 3%; border:1px #004d40 solid">
                    <h:selectOneMenu value="#{computeresultController.level}" onchange="submit()" class="form-control">
                        <f:selectItem itemValue="" itemLabel="Select Level"/>
                         <f:selectItem itemValue="10" itemLabel="Pre-Nursery"/>
                            <f:selectItem itemValue="101" itemLabel="Nursery One"/>
                            <f:selectItem itemValue="102" itemLabel="Nursery Two"/>
                            <f:selectItem itemValue="103" itemLabel="Nursery Three"/>
                            <f:selectItem itemValue="100" itemLabel="Primary One"/>
                            <f:selectItem itemValue="200" itemLabel="Primary Two"/>
                            <f:selectItem itemValue="300" itemLabel="Primary Three"/>
                            <f:selectItem itemValue="400" itemLabel="Primary Four"/>
                            <f:selectItem itemValue="500" itemLabel="Primary Five"/>
                            <f:selectItem itemValue="600" itemLabel="Primary Six"/>
                            <f:selectItem itemValue="1" itemLabel="Basic 7"/>
                        <f:selectItem itemValue="2" itemLabel="Basic 8"/>
                        <f:selectItem itemValue="3" itemLabel="Basic 9"/>
                        <f:selectItem itemValue="4" itemLabel="SSS 1"/>
                        <f:selectItem itemValue="5" itemLabel="SSS 2"/>
                        <f:selectItem itemValue="6" itemLabel="SSS 3"/>
                        <f:selectItem itemValue="7" itemLabel="Pure Science"/>
                        <f:selectItem itemValue="8" itemLabel="Social Science"/>
                        <f:selectItem itemValue="9" itemLabel="Arts"/>
                        <f:selectItem itemValue="11" itemLabel="Extra class"/>
                    </h:selectOneMenu>                    
                    <h:selectOneMenu value="#{computeresultController.classcode}" onchange="submit()" class="form-control">
                        <f:selectItem itemValue="" itemLabel="Select Class"/>
                        <f:selectItems value="#{computeresultController.classByLevel}" var="class" itemValue="#{class.classcode}" itemLabel="#{class.classcode}"/>
                    </h:selectOneMenu>               
                    <br></br><br></br>
                    <b><h:outputText value="#{computeresultController.name}"/></b>
                </div>
                
                <br></br>
                <div class="col s12 m2" style=" margin-top: 3%">
                <h:commandButton class="waves-effect waves-light btn" style=" background: orangered; cursor: pointer" action="#{computeresultController.deleteAttendance()}" value="CLEAR">      
                </h:commandButton>          
                 </div>
            </div>
            <div class="row ">
                <div class="col-12"  >
                    CLASS: <h:outputText value="#{computeresultController.classcode}"/>
                    <h:dataTable binding="#{table}" value="#{computeresultController.allAttendance}" var="stud" rowClasses="oddrows,evenrows" rules="all" width="100%" styleClass="people" style="border:1px " >
<h:column>
                            <f:facet name="header">
                               SN
                            </f:facet>
    <center>   <h:outputText value="#{table.rowIndex+1}"/> </center>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                Name of Pupils<span style="color: #333333">.........</span>
                            </f:facet>
                          
                            <h:commandLink action="#{computeresultController.computeAttendance(stud)}" value="#{stud.name}" />                  
                        </h:column>
                       <h:column>
                            <f:facet name="header">
                                Maximum
                            </f:facet>
                            <center>    #{stud.max}</center>
                        </h:column>                       
                        <h:column>
                            <f:facet name="header">
                                Days Present
                            </f:facet>
                            <center>     #{stud.presence}</center>
                        </h:column>                        
                         <h:column>
                            <f:facet name="header">
                               Days Absent
                            </f:facet>
                             <center> #{stud.absence}</center>
                        </h:column>                                                
                    </h:dataTable>
                </div>
            </div> 
        </h:form>    

       <script>
            $(document).on("ready", function () {
                $('select').material_select();
            });
        </script>
    </h:body>
</html>
