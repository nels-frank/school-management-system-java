<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Make Expenses</title>
        <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
        <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" type="text/css" href="plugins/cubeportfolio/css/cubeportfolio.min.css"/>
        <link href="css/nivo-lightbox.css" rel="stylesheet" />
        <link href="css/nivo-lightbox-theme/default/default.css" rel="stylesheet" type="text/css" />
        <link href="css/owl.carousel.css" rel="stylesheet" media="screen" />
        <link href="css/owl.theme.css" rel="stylesheet" media="screen" />
        <link href="css/animate.css" rel="stylesheet" />
        <link href="css/style.css" rel="stylesheet"/>

        <!-- boxed bg -->
        <link id="bodybg" href="bodybg/bg1.css" rel="stylesheet" type="text/css" />
        <!-- template skin -->
        <link id="t-colors" href="color/default.css" rel="stylesheet"/>
    </h:head>
    <h:body>
       <div id="page-top" data-spy="scroll" data-target=".navbar-custom">
            <div id="wrapper">

                <nav class="navbar navbar-custom navbar-fixed-top" role="navigation" style="background:orangered" >

                    <div class="container navigation" >

                        <div class="navbar-header page-scroll">
                            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-main-collapse">
                                <i class="fa fa-bars"></i>
                            </button>
                        </div>
                    </div>
                    <!-- /.container -->
                </nav>

                <center>Registration Page</center>
                <!-- Section: intro -->
                <section id="intro" class="intro">
                    <div class="intro-content">
                        <div class="container">
                            <div class="row">
                                <div class="col-lg-4"></div>
                                <div class="col-lg-4">
                                    <div class="form-wrapper">
                                        <div class="wow fadeInRight" data-wow-duration="2s" data-wow-delay="0.2s">
                                            <div class="panel panel-skin">
                                                <div class="panel-heading" style="background: orangered" >
                                                    <h5 class="panel-title"><span class="fa fa-pencil-square-o"></span> Daily Account Closure <small>(It's free!)</small></h5>
                                                </div>
                                                <div class="panel-body">
                                                    <div id="errormessage"></div>

                                                    <h:form role="form" class="contactForm lead">
                                                        <div class="row">
                        <div class="col-xs-6 col-sm-6 col-md-6">
                        <div class="form-group">
                        <label>Session</label><br></br>
                        <h:selectOneMenu value="#{accountController.sessions}" class="form-control"> 
                        <f:selectItem itemLabel="Select Session"/>
                        <f:selectItem itemValue="2019/2020" itemLabel="2019/2020"/>
                        <f:selectItem itemValue="2020/2021" itemLabel="2020/2021"/>
                        <f:selectItem itemValue="2021/2022" itemLabel="2021/2022"/>
                        <f:selectItem itemValue="2022/2023" itemLabel="2022/2023"/>
                        <f:selectItem itemValue="2023/2024" itemLabel="2023/2024"/>                       
                        <f:selectItem itemValue="2024/2025" itemLabel="2024/2025"/>
                        <f:selectItem itemValue="2025/2026" itemLabel="2025/2026"/>
                        <f:selectItem itemValue="2026/2027" itemLabel="2026/2027"/>
                        <f:selectItem itemValue="2027/2028" itemLabel="2027/2028"/>
                        <f:selectItem itemValue="2028/2029" itemLabel="2028/2029"/>                      
                        <f:selectItem itemValue="2029/2030" itemLabel="2029/2030"/>
                        <f:selectItem itemValue="2030/2031" itemLabel="2030/2031"/>
                        <f:selectItem itemValue="2031/2032" itemLabel="2031/2032"/>
                        <f:selectItem itemValue="2032/2033" itemLabel="2032/2033"/>
                        <f:selectItem itemValue="2033/2034" itemLabel="2033/2034"/>                       
                        <f:selectItem itemValue="2034/2035" itemLabel="2034/2035"/>
                        <f:selectItem itemValue="2035/2036" itemLabel="2035/2036"/>
                        <f:selectItem itemValue="2036/2037" itemLabel="2036/2037"/>
                        <f:selectItem itemValue="2037/2038" itemLabel="2037/2038"/>
                        <f:selectItem itemValue="2038/2039" itemLabel="2038/2039"/>
                        <f:selectItem itemValue="2039/2040" itemLabel="2039/2040"/>
                    </h:selectOneMenu>
                    <div class="validation"></div>
                   </div>
                    </div>   
                                                            
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                    <label>Term</label><br></br>
                    <h:selectOneMenu value="#{accountController.term}" class="form-control"> 
                        <f:selectItem itemLabel="Select Term"/>
                        <f:selectItem itemLabel="1ST TERM" itemValue="1ST TERM"/>
                        <f:selectItem itemLabel="2ND TERM" itemValue="2ND TERM"/>
                        <f:selectItem itemLabel="3RD TERM" itemValue="3RD TERM"/>
                    </h:selectOneMenu> 
                    <div class="validation"></div>
                    </div>
                    </div>
                    <div class="form-group">                                         
                        <h:commandLink class="waves-effect waves-light btn"  action="#{accountController.dailyClose()}" value="CLOSE TODAY" style="background-color: orangered;  margin-left: 20%; font-style: inherit; color: white; font-size: large"/>
                     </div>                                                          
                     </div>                              
                                                        <h6><h:outputText value="#{accountController.msssg}" style="color: orangered"/></h6> 
                                                    </h:form>
                                                </div>
                                            </div>				
                                        </div>
                                    </div>
                                </div>
                            </div>		
                        </div>
                    </div>		
                </section>
           </div>
        </div>
        <a href="#" class="scrollup"><i class="fa fa-angle-up active"></i></a>
           <!-- Core JavaScript Files -->
            <script src="designs/js/jquery.min.js"></script>	 
            <script src="designs/js/bootstrap.min.js"></script>
            <script src="designs/js/jquery.easing.min.js"></script>
            <script src="designs/js/wow.min.js"></script>
            <script src="designs/js/jquery.scrollTo.js"></script>
            <script src="designs/js/jquery.appear.js"></script>
            <script src="designs/js/stellar.js"></script>
            <script src="designs/plugins/cubeportfolio/js/jquery.cubeportfolio.min.js"></script>
            <script src="designs/js/owl.carousel.min.js"></script>
            <script src="designs/js/nivo-lightbox.min.js"></script>
            <script src="designs/js/custom.js"></script>
            <script src="designs/contactform/contactform.js"></script>
    </h:body>
</html>
