      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
    <h:head>
        <title>Prepare Students</title>
         <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css"/>
        <link href="font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
        <link rel="stylesheet" type="text/css" href="plugins/cubeportfolio/css/cubeportfolio.min.css"/>
        <link href="css/nivo-lightbox.css" rel="stylesheet" />
        <link href="css/nivo-lightbox-theme/default/default.css" rel="stylesheet" type="text/css" />
        <link href="css/owl.carousel.css" rel="stylesheet" media="screen" />
        <link href="css/owl.theme.css" rel="stylesheet" media="screen" />
        <link href="css/animate.css" rel="stylesheet" />
        <link href="css/style.css" rel="stylesheet"/>

        <!-- boxed bg -->
        <link id="bodybg" href="bodybg/bg1.css" rel="stylesheet" type="text/css" />
        <!-- template skin -->
        <link id="t-colors" href="color/default.css" rel="stylesheet"/>
    </h:head>
    
    <h:body>     
     <div id="page-top" data-spy="scroll" data-target=".navbar-custom">
            <div id="wrapper">

                <nav class="navbar navbar-custom navbar-fixed-top" role="navigation" style="background:orangered" >

                    <div class="container navigation" >

                        <div class="navbar-header page-scroll">
                            <button type="button" class="navbar-toggle" data-toggle="collapse" data-target=".navbar-main-collapse">
                                <i class="fa fa-bars"></i>
                            </button>
                            <a class="navbar-brand" href="index.html">
                                <img src="img/btlogo.png" alt="" width="60" height="50" />
                            </a>
                        </div>

                        <!-- Collect the nav links, forms, and other content for toggling -->
                        <div class="collapse navbar-collapse navbar-right navbar-main-collapse">
                            <ul class="nav navbar-nav">
                                <li class="active"><a href="adminpage.jsf">Dashboard</a></li>
                                
                            </ul>
                        </div>
                        <!-- /.navbar-collapse -->
                    </div>
                    <!-- /.container -->
                </nav>

                <center>Registration Page</center>
                <!-- Section: intro -->
                <section id="intro" class="intro">
                    <div class="intro-content">
                        <div class="container">
                            <div class="row">
                                <div class="col-lg-3"></div>
                                <div class="col-lg-6">
                                    <div class="form-wrapper">
                                        <div class="wow fadeInRight" data-wow-duration="2s" data-wow-delay="0.2s">

                                            <div class="panel panel-skin">
                                                <div class="panel-heading" style="background: #0e3344" >
                                                    <h5 class="panel-title"><span class="fa fa-pencil-square-o"></span> Prepare Students for School Fees Payment <small>(It's free!)</small></h5>
                                                </div>
                                                <div class="panel-body">
                                                    <div id="sendmessage">Your message has been sent. Thank you!</div>
                                                    <div id="errormessage"></div>

                                                     <h:form role="form" class="contactForm lead">
                <div class="row" >
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                        <label>Session</label><br></br>
                       <h:selectOneMenu value="#{feespaymentController.session}" class="form-control"> 
                        <f:selectItem itemLabel="Select Session"/>
                        <f:selectItem itemValue="2019/2020" itemLabel="2019/2020"/>
                        <f:selectItem itemValue="2020/2021" itemLabel="2020/2021"/>
                        <f:selectItem itemValue="2021/2022" itemLabel="2021/2022"/>
                        <f:selectItem itemValue="2022/2023" itemLabel="2022/2023"/>
                        <f:selectItem itemValue="2023/2024" itemLabel="2023/2024"/>                       
                        <f:selectItem itemValue="2024/2025" itemLabel="2024/2025"/>
                        <f:selectItem itemValue="2025/2026" itemLabel="2025/2026"/>
                        <f:selectItem itemValue="2026/2027" itemLabel="2026/2027"/>
                        <f:selectItem itemValue="2027/2028" itemLabel="2027/2028"/>
                        <f:selectItem itemValue="2028/2029" itemLabel="2028/2029"/>                      
                        <f:selectItem itemValue="2029/2030" itemLabel="2029/2030"/>
                        <f:selectItem itemValue="2030/2031" itemLabel="2030/2031"/>
                        <f:selectItem itemValue="2031/2032" itemLabel="2031/2032"/>
                        <f:selectItem itemValue="2032/2033" itemLabel="2032/2033"/>
                        <f:selectItem itemValue="2033/2034" itemLabel="2033/2034"/>                       
                        <f:selectItem itemValue="2034/2035" itemLabel="2034/2035"/>
                        <f:selectItem itemValue="2035/2036" itemLabel="2035/2036"/>
                        <f:selectItem itemValue="2036/2037" itemLabel="2036/2037"/>
                        <f:selectItem itemValue="2037/2038" itemLabel="2037/2038"/>
                        <f:selectItem itemValue="2038/2039" itemLabel="2038/2039"/>
                        <f:selectItem itemValue="2039/2040" itemLabel="2039/2040"/>
                    </h:selectOneMenu>
                    <div class="validation"></div>
                   </div>
                    </div>
                
                     
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                    <label>Term</label><br></br>
                        <h:selectOneMenu value="#{feespaymentController.term}" class="form-control"> 
                        <f:selectItem itemLabel="Select Term" itemValue=""/>
                        <f:selectItem itemLabel="1ST TERM" itemValue="1ST TERM"/>
                        <f:selectItem itemLabel="2ND TERM" itemValue="2ND TERM"/>
                        <f:selectItem itemLabel="3RD TERM" itemValue="3RD TERM"/>
                    </h:selectOneMenu> 
                    <div class="validation"></div>
                    </div>
                    </div>
        
                    
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                    <label>Class Level</label><br></br>
                       <h:selectOneMenu  value="#{feespaymentController.level}" onchange="submit()" class="form-control">
                        <f:selectItem itemValue="" itemLabel="Select Level"/>
                        <f:selectItem itemValue="10" itemLabel="Pre-Nursery"/>
                        <f:selectItem itemValue="101" itemLabel="Nursery One"/>
                        <f:selectItem itemValue="102" itemLabel="Nursery Two"/>
                        <f:selectItem itemValue="103" itemLabel="Nursery Three"/>
                        <f:selectItem itemValue="100" itemLabel="Primary One"/>
                        <f:selectItem itemValue="200" itemLabel="Primary Two"/>
                        <f:selectItem itemValue="300" itemLabel="Primary Three"/>
                        <f:selectItem itemValue="400" itemLabel="Primary Four"/>
                        <f:selectItem itemValue="500" itemLabel="Primary Five"/>
                        <f:selectItem itemValue="600" itemLabel="Primary Six"/>
                        <f:selectItem itemValue="1" itemLabel="Basic 7"/>
                        <f:selectItem itemValue="2" itemLabel="Basic 8"/>
                        <f:selectItem itemValue="3" itemLabel="Basic 9"/>
                        <f:selectItem itemValue="4" itemLabel="SSS 1"/>
                        <f:selectItem itemValue="5" itemLabel="SSS 2"/>
                        <f:selectItem itemValue="6" itemLabel="SSS 3"/>
                        <f:selectItem itemValue="7" itemLabel="Pure Science"/>
                        <f:selectItem itemValue="8" itemLabel="Social Science"/>
                        <f:selectItem itemValue="9" itemLabel="Arts"/>
                        <f:selectItem itemValue="11" itemLabel="Extra class"/>
                        </h:selectOneMenu>
                    <div class="validation"></div>
                    </div>
                    </div>
                    
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                    <label>Class Option</label><br></br>
                         <h:selectOneMenu  value="#{feespaymentController.classcode}" class="form-control">
                            <f:selectItem itemValue="" itemLabel="Select Class Option"/>
                            <f:selectItems value="#{feespaymentController.classcodeBylevel}" var="classlevel" itemValue="#{classlevel.classcode}" itemLabel="#{classlevel.classcode}"/>                          
                        </h:selectOneMenu>
                    <div class="validation"></div>
                    </div>
                    </div>                    
                                                                    <div class="col-xs-6 col-sm-6 col-md-6">
                                                                   <div class="form-group">
                                                                    <label>Tuition Fee</label>
                                                                    <h:inputText value="#{feespaymentController.tuitionfee}" required="true" requiredMessage="Tuition Fee is required" class="form-control">
                                                                    <f:passThroughAttribute value="Amount to be Paid" name="placeholder"/>
                                                                    </h:inputText>
                                                                    <div class="validation"></div>
                                                                    </div>
                                                                    </div>
                </div>
                         <div class="row"  style=" background:#843534; margin-left: 200px;margin-right: 200px">
                        <h:commandLink action="#{feespaymentController.prepareStudents()}" value="Prepare" class="btn btn-skin btn-block btn-lg">
                    </h:commandLink>
                         </div>
                            <h6><h:outputText value="#{feespaymentController.mnng}" style="color: orangered"/></h6>
                     
                                                     </h:form>
                                                </div>
                                            </div>				
                                        </div>
                                    </div>
                                </div>
                            </div>		
                        </div>
                    </div>		
                </section>
          </div>
          <a href="#" class="scrollup"><i class="fa fa-angle-up active"></i></a>
           <!-- Core JavaScript Files -->
            <script src="designs/js/jquery.min.js"></script>	 
            <script src="designs/js/bootstrap.min.js"></script>
            <script src="designs/js/jquery.easing.min.js"></script>
            <script src="designs/js/wow.min.js"></script>
            <script src="designs/js/jquery.scrollTo.js"></script>
            <script src="designs/js/jquery.appear.js"></script>
            <script src="designs/js/stellar.js"></script>
            <script src="designs/plugins/cubeportfolio/js/jquery.cubeportfolio.min.js"></script>
            <script src="designs/js/owl.carousel.min.js"></script>
            <script src="designs/js/nivo-lightbox.min.js"></script>
            <script src="designs/js/custom.js"></script>
            <script src="designs/contactform/contactform.js"></script>

        </div>
        <script>
            $(document).on("ready", function () {
                $('select').material_select();
            });
            $('.datepicker').pickadate({
                selectMonths: true, // Creates a dropdown to control month
                selectYears: 200 // Creates a dropdown of 15 years to control year
            });
        </script>
    </h:body>
</html>
