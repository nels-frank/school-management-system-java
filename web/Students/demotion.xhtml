                <center>Registration Page</center>
                <!-- Section: intro -->
                <section id="intro" class="intro">
                    <div class="intro-content">
                        <div class="container">
                            <div class="row">
                                <div class="col-lg-2"></div>
                                <div class="col-lg-6">
                                    <div class="form-wrapper">
                                        <div class="wow fadeInRight" data-wow-duration="2s" data-wow-delay="0.2s">

                                            <div class="panel panel-skin">
                                                <div class="panel-heading" style="background: darkblue" >
                                                    <h5 class="panel-title"><span class="fa fa-pencil-square-o"></span> Student's Demotion Portal<small>(It's free!)</small></h5>
                                                </div>
                                                <div class="panel-body">
                                                    <div id="sendmessage">Your message has been sent. Thank you!</div>
                                                    <div id="errormessage"></div>
                                                              <h:form role="form" class="contactForm lead" enctype="multipart/form-data">
                                                              <div class="row" >
                    
                                                                 
                    
                  
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                    <label>Class Level</label><br></br>
                       <h:selectOneMenu  value="#{studentsinfoController.level}" onchange="submit()" class="form-control">
                            <f:selectItem itemValue="" itemLabel="Select Class Level"/>
                        <f:selectItem itemValue="10" itemLabel="Pre-Nursery"/>
                        <f:selectItem itemValue="101" itemLabel="Nursery One"/>
                        <f:selectItem itemValue="102" itemLabel="Nursery Two"/>
                        <f:selectItem itemValue="103" itemLabel="Nursery Three"/>
                        <f:selectItem itemValue="100" itemLabel="Primary One"/>
                        <f:selectItem itemValue="200" itemLabel="Primary Two"/>
                        <f:selectItem itemValue="300" itemLabel="Primary Three"/>
                        <f:selectItem itemValue="400" itemLabel="Primary Four"/>
                        <f:selectItem itemValue="500" itemLabel="Primary Five"/>
                        <f:selectItem itemValue="600" itemLabel="Primary Six"/>
                        <f:selectItem itemValue="1" itemLabel="Basic 7"/>
                        <f:selectItem itemValue="2" itemLabel="Basic 8"/>
                        <f:selectItem itemValue="3" itemLabel="Basic 9"/>
                        <f:selectItem itemValue="4" itemLabel="SSS 1"/>
                        <f:selectItem itemValue="5" itemLabel="SSS 2"/>
                        <f:selectItem itemValue="6" itemLabel="SSS 3"/>
                        <f:selectItem itemValue="7" itemLabel="Pure Science"/>
                        <f:selectItem itemValue="8" itemLabel="Social Science"/>
                        <f:selectItem itemValue="9" itemLabel="Arts"/>
                        <f:selectItem itemValue="11" itemLabel="Extra class"/>
                        </h:selectOneMenu>
                    <div class="validation"></div>
                    </div>
                    </div>
                                                                  
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                    <label>Class Option</label><br></br>
                         <h:selectOneMenu  value="#{studentsinfoController.classcode}" class="form-control">
                            <f:selectItem itemValue="" itemLabel="Select Class Option"/>
                            <f:selectItems value="#{studentsinfoController.classcodeBylevel}" var="classlevel" itemValue="#{classlevel.classcode}" itemLabel="#{classlevel.classcode}"/>                          
                        </h:selectOneMenu>
                    <div class="validation"></div>
                    </div>
                    </div>
                   <br></br>
                    <div class="col-xs-6 col-sm-6 col-md-6">
                    <div class="form-group">
                        <label>Student's Admission Number</label><br></br>
                        <h:inputText value="#{studentsinfoController.regno}" class="form-control">
                            <f:passThroughAttribute name="placeholder" value="Admission Number"/>
                        </h:inputText>
                        <div class="validation"></div>
                    </div>
                    </div>                                                                                                                 
                   </div>                                                                  
                    <div class="row"  style=" background: darkblue; margin-left: 100px;margin-right: 180px">
                        <h:commandLink action="#{studentsinfoController.Demotion}" value="Submit" class="btn btn-skin btn-block btn-lg">
                    </h:commandLink>
                         </div>                                                                 
                                    <h6><h:outputText value="#{studentsinfoController.mssg}" style="color: orangered"/></h6>
                                            
                                                    </h:form>
                                                </div>
                                            </div>				
                                        </div>
